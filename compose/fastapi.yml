# Python (FastAPI + Uvicorn) — one API service. Combine with compose/base.yml:
#   docker compose -f compose/base.yml -f compose/fastapi.yml up -d --build
services:
  fastapi:
    build:
      context: ../python-fastapi
      dockerfile_inline: |
        FROM python:3.14-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 8000
        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "3"]
    restart: unless-stopped
    environment: { PORT: 8000, DATABASE_URL: postgres://app:app@db:5432/app, POOL_SIZE: "10" }
    depends_on:
      db:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.fastapi.rule: "PathPrefix(`/fastapi`)"
      traefik.http.routers.fastapi.entrypoints: "web"
      traefik.http.routers.fastapi.middlewares: "fastapi-strip"
      traefik.http.middlewares.fastapi-strip.stripprefix.prefixes: "/fastapi"
      traefik.http.services.fastapi.loadbalancer.server.port: "8000"