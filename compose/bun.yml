# Bun (Hono on Bun's native HTTP server — no Express) — one API service.
# Combine with compose/base.yml:
#   docker compose -f compose/base.yml -f compose/bun.yml up -d --build
services:
  bun:
    build:
      context: ../ts-hono
      dockerfile_inline: |
        FROM oven/bun:1-slim
        WORKDIR /app
        COPY package*.json ./
        RUN bun install --omit=dev
        COPY . .
        EXPOSE 3001
        CMD ["bun", "run", "main.ts"]
    restart: unless-stopped
    environment: { PORT: 3001, DATABASE_URL: postgres://app:app@db:5432/app, POOL_SIZE: "10" }
    depends_on:
      db:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.bun.rule: "PathPrefix(`/bun`)"
      traefik.http.routers.bun.entrypoints: "web"
      traefik.http.routers.bun.middlewares: "bun-strip"
      traefik.http.middlewares.bun-strip.stripprefix.prefixes: "/bun"
      traefik.http.services.bun.loadbalancer.server.port: "3001"