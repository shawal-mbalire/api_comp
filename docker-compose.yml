# Aggregator — `docker compose up -d --build` still starts EVERYTHING
# (Traefik + Postgres + all 8 stacks) with one command.
#
# The actual service definitions now live in per-purpose compose files under
# compose/ so you can run any SUBSET instead:
#
#   docker compose -f compose/base.yml -f compose/rust.yml up -d --build   # one API
#   docker compose -f compose/base.yml -f compose/go.yml -f compose/java.yml up -d --build
#   just up rust go                                                        # same, via just
#
# Per-stack files are merged into the same project (`api-comp`), so Traefik
# discovery, depends_on health gates, and the shared Postgres volume behave
# identically no matter how a stack is brought up.
name: api-comp

include:
  - path: compose/base.yml
  - path: compose/rust.yml
  - path: compose/go.yml
  - path: compose/java.yml
  - path: compose/dotnet.yml
  - path: compose/bun.yml
  - path: compose/node.yml
  - path: compose/fastapi.yml
  - path: compose/php.yml